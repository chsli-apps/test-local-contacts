    <style>
      /* Brand tokens: same palette and scale as the iOS app (CHColor, CHSpacing). */
      :root {
        --ch-font-primary: "Merriweather Sans", Arial, sans-serif;
        --ch-navy: #002d97;
        --ch-blue: #005ae8;
        --ch-midnight: #001d66;
        --ch-wine: #81008a;
        --ch-gold: #e6ae03;
        --ch-border: #e5e7eb;
        --ch-background: #ffffff;
        --ch-space-1: 4px;
        --ch-space-2: 8px;
        --ch-space-3: 12px;
        --ch-space-4: 16px;
        --ch-space-6: 32px;
        --ch-radius-lg: 8px;
        --ch-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--ch-font-primary);
        font-weight: 400;
        color: var(--ch-navy);
        background: var(--ch-background);
        font-variant-numeric: lining-nums tabular-nums;
        line-height: 1.5;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--ch-background);
        padding: var(--ch-space-4) var(--ch-space-4) var(--ch-space-3);
        border-bottom: 1px solid var(--ch-border);
      }

      .app-name {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ch-midnight);
      }

      .screen-name {
        margin: var(--ch-space-1) 0 var(--ch-space-3);
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1.2;
        color: var(--ch-navy);
      }

      .search {
        display: flex;
        align-items: center;
        gap: var(--ch-space-2);
        min-height: 44px;
        padding: 0 var(--ch-space-3);
        background: var(--ch-background);
        border: 1px solid var(--ch-border);
        border-radius: var(--ch-radius-lg);
        box-shadow: var(--ch-shadow-sm);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .search:focus-within {
        outline: 2px solid var(--ch-blue);
        outline-offset: 2px;
      }

      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        font: inherit;
        font-size: 1rem;
        color: var(--ch-navy);
      }

      .search input::placeholder {
        color: var(--ch-midnight);
        opacity: 0.7;
      }

      .clear-button {
        border: 0;
        background: transparent;
        padding: var(--ch-space-1);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--ch-blue);
        cursor: pointer;
        border-radius: 4px;
      }

      .clear-button:hover {
        color: var(--ch-navy);
      }
      .clear-button:focus-visible {
        outline: 2px solid var(--ch-blue);
        outline-offset: 2px;
      }

      main {
        padding: 0 var(--ch-space-4) var(--ch-space-6);
      }

      /* Row layout: name/title block on the left, phone buttons stacked on the right.
       No wrapping at any width: the name block shrinks and its text wraps instead. */
      .contact {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--ch-space-3);
        padding: var(--ch-space-3) 0;
        border-bottom: 1px solid var(--ch-border);
      }

      .contact-info {
        flex: 1 1 0;
        min-width: 0;
      }

      .contact-name {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: var(--ch-navy);
      }

      .contact-title {
        margin: var(--ch-space-1) 0 0;
        font-size: 0.875rem;
        color: var(--ch-midnight);
      }

      /* Phones stack vertically, one per row; the column never shrinks below its content. */
      .phones {
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        gap: 0;
      }

      /* Each phone is a single row: label on the left, number on the right. */
      .phone-link {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: var(--ch-space-2);
        white-space: nowrap;
        min-height: 44px;
        padding: var(--ch-space-1) var(--ch-space-3);
        border-radius: var(--ch-radius-lg);
        border: 0;
        background: var(--ch-background);
        color: var(--ch-blue);
        text-decoration: none;
      }

      /* Light gray divider between the two phones; only the second one gets it. */
      .phone-link + .phone-link {
        border-top: 1px solid var(--ch-border);
        border-top-left-radius: 0;
        border-top-right-radius: 0;
      }

      .phone-link:hover {
        color: var(--ch-navy);
      }
      .phone-link:focus-visible {
        outline: 2px solid var(--ch-blue);
        outline-offset: 2px;
      }
      .phone-link:active {
        color: var(--ch-navy);
      }

      .phone-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ch-midnight);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      .phone-number {
        font-size: 1rem;
        font-weight: 600;
      }

      .phone-note {
        display: block;
        font-size: 0.75rem;
        font-weight: 400;
        color: var(--ch-midnight);
      }

      .empty {
        padding: var(--ch-space-6) 0;
        text-align: center;
        color: var(--ch-midnight);
      }

      .load-error {
        margin: var(--ch-space-4);
        padding: var(--ch-space-3);
        border: 1px solid var(--ch-wine);
        border-radius: var(--ch-radius-lg);
        color: var(--ch-wine);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <p class="app-name">Catholic Health Emergency Contacts</p>
      <h1 class="screen-name">VP Contacts</h1>
      <label class="search">
        <span class="sr-only">Search VP contacts</span>
        <input
          id="search-input"
          type="search"
          placeholder="Search name or title"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button id="clear-button" class="clear-button" type="button" hidden>
          Clear
        </button>
      </label>
    </header>

    <main>
      <div id="load-error" class="load-error" hidden></div>
      <div id="contact-list"></div>
      <p id="empty-message" class="empty" hidden>No matching contacts.</p>
    </main>

    <!--
    Contact data. Same shape as the app's Resources/Seed/leadership.json.
    Sample entries only: 516-555-01xx numbers are reserved for examples.
    Replace this array with the real VP list.
  -->
    <script id="contacts-data" type="application/json">
      [
        {
          "name": "Sample VP One",
          "title": "VP Sample Division",
          "phones": [
            { "label": "mobile", "raw": "516-555-0101", "note": null },
            { "label": "office", "raw": "516-555-0102", "note": null }
          ]
        },
        {
          "name": "Sample VP Two",
          "title": "VP Sample Operations",
          "phones": [{ "label": "office", "raw": "516-555-0103" }]
        }
      ]
    </script>

    <script>
      // Phone numbers arrive as free text ("516-761-1592", "1-516-705-3850"). Normalize to a
      // display form and a tel: form; return null for anything that is not a 10-digit US number.
      function normalizePhone(raw) {
        var digits = String(raw || "").replace(/\D/g, "");
        if (digits.length === 11 && digits.charAt(0) === "1") {
          digits = digits.slice(1);
        }
        if (digits.length !== 10) {
          return null;
        }
        return {
          display:
            "(" +
            digits.slice(0, 3) +
            ") " +
            digits.slice(3, 6) +
            "-" +
            digits.slice(6),
          dialable: "+1" + digits,
        };
      }

      function loadContacts() {
        var text = document.getElementById("contacts-data").textContent;
        var parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) {
          throw new Error("Contact data must be an array.");
        }
        return parsed;
      }

      // Keep only contacts with a name and at least one dialable phone, so the list never shows blanks.
      function prepareContacts(raw) {
        var result = [];
        raw.forEach(function (entry) {
          var name = String(entry.name || "").trim();
          if (!name) {
            return;
          }
          var phones = [];
          (entry.phones || []).forEach(function (phone) {
            var normalized = normalizePhone(phone.raw);
            if (normalized) {
              phones.push({
                label: String(phone.label || "other"),
                note: phone.note ? String(phone.note).trim() : "",
                display: normalized.display,
                dialable: normalized.dialable,
              });
            }
          });
          result.push({
            name: name,
            title: String(entry.title || "").trim(),
            phones: phones,
            searchText: (name + " " + (entry.title || "")).toLowerCase(),
          });
        });
        return result;
      }

      function buildContactElement(contact) {
        var wrapper = document.createElement("article");
        wrapper.className = "contact";

        var info = document.createElement("div");
        info.className = "contact-info";

        var name = document.createElement("h2");
        name.className = "contact-name";
        name.textContent = contact.name;
        info.appendChild(name);

        if (contact.title) {
          var title = document.createElement("p");
          title.className = "contact-title";
          title.textContent = contact.title;
          info.appendChild(title);
        }
        wrapper.appendChild(info);

        if (contact.phones.length > 0) {
          var phones = document.createElement("div");
          phones.className = "phones";
          contact.phones.forEach(function (phone) {
            var link = document.createElement("a");
            link.className = "phone-link";
            link.href = "tel:" + phone.dialable;
            link.setAttribute(
              "aria-label",
              "Call " + contact.name + " " + phone.label + " " + phone.display,
            );

            var left = document.createElement("span");
            left.className = "phone-meta";
            var label = document.createElement("span");
            label.className = "phone-label";
            label.textContent = phone.label;
            left.appendChild(label);
            if (phone.note) {
              var note = document.createElement("span");
              note.className = "phone-note";
              note.textContent = phone.note;
              left.appendChild(note);
            }

            var number = document.createElement("span");
            number.className = "phone-number";
            number.textContent = phone.display;

            link.appendChild(left);
            link.appendChild(number);
            phones.appendChild(link);
          });
          wrapper.appendChild(phones);
        }

        return wrapper;
      }

      function renderContacts(contacts, query) {
        var list = document.getElementById("contact-list");
        var emptyMessage = document.getElementById("empty-message");
        list.textContent = "";

        var matches = contacts.filter(function (contact) {
          return contact.searchText.indexOf(query) !== -1;
        });

        matches.forEach(function (contact) {
          list.appendChild(buildContactElement(contact));
        });
        emptyMessage.hidden = matches.length > 0;
      }

      function start() {
        var contacts;
        try {
          contacts = prepareContacts(loadContacts());
        } catch (error) {
          var errorBox = document.getElementById("load-error");
          errorBox.textContent =
            "The contact data could not be read. Check the JSON in this file.";
          errorBox.hidden = false;
          return;
        }

        var input = document.getElementById("search-input");
        var clearButton = document.getElementById("clear-button");

        function update() {
          var query = input.value.trim().toLowerCase();
          clearButton.hidden = input.value.length === 0;
          renderContacts(contacts, query);
        }

        input.addEventListener("input", update);
        clearButton.addEventListener("click", function () {
          input.value = "";
          update();
          input.focus();
        });

        update();
      }

      start();
    </script>
  </body>
</html>
